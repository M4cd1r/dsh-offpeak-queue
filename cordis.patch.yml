# dsh-offpeak-queue bundle patch: one host row over the desktop profile.
# The row name resolves from the profile's node_modules where the package is installed.
# dsh-offpeak is required at runtime: mount it before this row so the queue
# can read its provider schedules. The queue does not fall back to local windows.
#
# Emergency disable without uninstalling: add this row at the top-level array of
# the profile's cordis.patch.yml, then restart the profile:
#   { id: offpeak-queue, name: dsh-offpeak-queue, disabled: true }
- insert:
    - id: offpeak-queue
      name: dsh-offpeak-queue
